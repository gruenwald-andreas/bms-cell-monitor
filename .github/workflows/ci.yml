name: Embedded C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Build Docker Environment
        run: docker build -t bms-ci-env .

      - name: Run Static Analysis, Build & Unit Tests in Docker
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" bms-ci-env bash -c "
            cppcheck --enable=warning,style,performance --error-exitcode=1 -I include src/ &&
            cmake -B build-ci -DCMAKE_BUILD_TYPE=Release &&
            cmake --build build-ci &&
            ctest --test-dir build-ci --output-on-failure
          "