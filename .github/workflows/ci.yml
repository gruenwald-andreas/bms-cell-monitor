name: Embedded C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          apt-get update && apt-get install -y build-essential cmake git cppcheck

      - name: Static Code Analysis (Cppcheck)
        run: |
          cppcheck --enable=warning,style,performance --error-exitcode=1 -I include src/

      - name: Configure & Build with CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Run Unit Tests
        run: |
          ctest --test-dir build --output-on-failure
